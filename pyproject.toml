[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "A configurable CSV validation tool driven by declarative YAML rules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7",
    "pydantic>=2.9,<3",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]
