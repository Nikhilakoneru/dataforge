[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "A configurable CSV validation tool driven by declarative YAML rules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7",
    "pydantic>=2.9,<3",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dataforge"]

[tool.coverage.report]
# The suite covers every line today. Failing under 90 leaves room for a
# genuinely hard-to-reach branch without letting coverage quietly rot.
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# strict applies to the package itself. The test suite isn't annotated
# — typing every fixture and helper would add noise without catching
# anything the tests don't already catch by failing.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
